name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render documentation
    uses: netresearch/.github/.github/workflows/pages-build.yml@main
    permissions:
      contents: read
    with:
      artifact-path: .Build/docs
      # Render the TYPO3 docs with render-guides, then provide a lowercase
      # index.html for the Pages root (render-guides emits Index.html).
      build-command: |
        docker run --rm -v "$PWD":/project -w /project \
          ghcr.io/typo3-documentation/render-guides@sha256:6080cbe815ae702e11a932924cdbcf6ec934fbdf9568931a5ed6bafc4b69959c \
          configure Documentation
        docker run --rm -v "$PWD":/project -w /project \
          ghcr.io/typo3-documentation/render-guides@sha256:6080cbe815ae702e11a932924cdbcf6ec934fbdf9568931a5ed6bafc4b69959c \
          render --config=Documentation --output=.Build/docs Documentation
        cp .Build/docs/Index.html .Build/docs/index.html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    uses: netresearch/.github/.github/workflows/pages-deploy.yml@main
    permissions:
      pages: write
      id-token: write
      contents: read
