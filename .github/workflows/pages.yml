name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render product page and documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Runs before the render: the product page needs the origin and the base
      # path to build canonical, hreflang and sitemap URLs.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      # The site root is the product page; the technical documentation moves to
      # /docs/. The documentation is the right material for someone implementing
      # the extension and the wrong first screen for someone deciding whether to
      # evaluate it — and it never stated that this is alpha software.
      - name: Render product page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node landingpage/render.mjs

      - name: Render documentation
        run: |
          docker run --rm \
            -v "$PWD":/project \
            -w /project \
            ghcr.io/typo3-documentation/render-guides@sha256:6080cbe815ae702e11a932924cdbcf6ec934fbdf9568931a5ed6bafc4b69959c \
            configure Documentation
          docker run --rm \
            -v "$PWD":/project \
            -w /project \
            ghcr.io/typo3-documentation/render-guides@sha256:6080cbe815ae702e11a932924cdbcf6ec934fbdf9568931a5ed6bafc4b69959c \
            render --config=Documentation --output=.Build/site/docs Documentation

      # render-guides emits two controls that only work on docs.typo3.org: the
      # cross-documentation menu and the version switcher. Both fetch a
      # *-proxy.php endpoint that does not exist here, so every docs page issued
      # a 404 — found by the axe step's asset check, confirmed on the live site.
      - name: Remove the docs.typo3.org proxy controls
        run: node landingpage/strip-docs-proxies.mjs .Build/site/docs

      - name: Provide lowercase index.html for the docs root
        # render-guides emits Index.html (capital I); GitHub Pages serves
        # index.html for the directory root, so copy it to avoid a 404 at /docs/.
        run: cp .Build/site/docs/Index.html .Build/site/docs/index.html

      # Every inbound link to the old documentation root points at a path like
      # /Configuration/Index.html. Pages has no server-side redirects, so each
      # one gets a meta-refresh stub. The root is the deliberate exception.
      - name: Keep old documentation links working
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node landingpage/redirect-stubs.mjs

      # Gates the product pages: a manifest that disagrees with ext_emconf.php, a
      # version the manifest does not know, a missing alpha notice, missing
      # metadata, an untagged contact link, a missing "what is not claimed"
      # section, a third-party asset request, or a docs tree that did not render.
      - name: Verify the rendered site
        run: node landingpage/verify.mjs

      # Contrast and anything else that depends on resolved CSS is not decidable
      # from markup, so verify.mjs cannot see it. axe found four contrast
      # failures on a page that gate passed.
      - name: Audit accessibility with axe
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install chromium
          node landingpage/axe-audit.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: .Build/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
