name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

# A new push to a pull request cancels the run for the push before it, so
# superseded test matrices stop taking runners. Runs on main, in the merge
# queue and on the schedule are never cancelled. The group sits here in the
# caller, not in the reusable workflow: a caller that invokes ci.yml twice
# would otherwise put both calls in one group and cancel one with the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# This workflow runs the extension's own test matrix and is the ONE per-extension
# CI value: its `with:` block (php-versions, typo3-versions, matrix-exclude,
# run-functional-tests, db settings, remove-dev-deps, coverage, …) differs per
# extension. It is therefore listed under intentional-drift in
# .github/template.yaml — customise it freely here. The security/quality jobs
# with elevated permissions are drift-enforced in checks.yml; do not duplicate
# them here. PHP mutation testing lives in mutation.yml (extra, not in template).
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4"]'
      typo3-versions: '["^13.4","^14.3"]'
      # This extension's tests require both cms-core and cms-backend.
      typo3-packages: '["typo3/cms-core","typo3/cms-backend"]'
      run-functional-tests: true
      functional-test-db: sqlite
      # The reusable auto-detects ci:cgl / ci:phpstan / ci:tests:unit /
      # ci:tests:functional, but not this repo's ci:rector script name.
      rector-command: 'composer ci:rector'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
