name: Mutation Testing

# Infection mutation testing is not part of the shared typo3-ci-workflows
# template (checks.yml / ci.yml), so it lives here as an extra, repo-specific
# workflow. It preserves the mutation coverage this extension had before the
# migration to the centralized CI template.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: xdebug

      - name: Install dependencies
        run: |
          composer config --no-plugins audit.block-insecure false
          composer install --no-interaction --prefer-dist --no-progress

      - name: Mutation testing
        run: composer ci:mutation:ci
