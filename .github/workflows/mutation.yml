name: Mutation Testing

# Infection mutation testing is not part of the shared typo3-ci-workflows CI
# matrix (it needs coverage and runs on a single PHP version), so it runs via
# the dedicated php-mutation reusable instead of an inline job.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  mutation:
    uses: netresearch/.github/.github/workflows/php-mutation.yml@main
    permissions:
      contents: read
    with:
      php-version: '8.3'
