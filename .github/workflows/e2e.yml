name: E2E Tests

# Playwright specs in Build/tests/playwright/specs against a TYPO3 13.4
# installation the shared reusable workflow sets up (MariaDB, `typo3 setup`,
# PHP built-in server, admin user `admin` / `Joh316!!` — the specs' defaults).
# For local runs: make test-e2e (requires DDEV).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

# Supersede stale PR runs; merge_group and push-to-main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    uses: netresearch/typo3-ci-workflows/.github/workflows/e2e.yml@main
    permissions:
      contents: read
    with:
      # Same range as the ci.yml matrix (8.2-8.4); composer's platform is 8.2.
      php-version: '8.3'
      # composer.json allows ^13.4 || ^14.0; ci.yml tests 13.4 only, and an
      # unconstrained install would resolve 14.
      typo3-versions: '["^13.4"]'
      typo3-packages: '["typo3/cms-core","typo3/cms-backend"]'
      # The specs need two installation states that cannot coexist: without an
      # nr-llm Task (ai-chat-module.spec.ts) and with one (every spec driving
      # the toolbar chat panel). seed-and-test.sh branches on the variant.
      setup-variants: '["unconfigured","configured"]'
      test-command: 'bash Build/tests/playwright/seed-and-test.sh'
      # var/log/ carries the TYPO3 exception log behind a backend 500.
      artifact-path: |
        playwright-report/
        Build/tests/playwright/test-results/
        var/log/
