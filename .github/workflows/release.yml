name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: nr-mcp-agent
      package-name: netresearch/nr-mcp-agent
      extension-key: nr_mcp_agent
      # Not published to TER (no TER token in this repo, by decision) and not
      # registered on docs.typo3.org. Packagist lists the package since
      # 2026-07-22 and picks up new tags through its GitHub hook, so the
      # workflow does not notify it. Remove a skip when its channel is set up.
      skip-ter: true
      skip-packagist: true
      skip-docs: true
