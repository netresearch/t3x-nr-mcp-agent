services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Netresearch\NrMcpAgent\:
    resource: '../Classes/*'
    # Registered in Services.php, and only when EXT:dashboard is installed.
    exclude: '../Classes/Dashboard/*'

  # Seams of the AI assistant dashboard widgets. Each alias is the point to
  # re-bind.
  # Open points come from the chat's store. "@?" injects null while the store
  # (OpenPointVisibility) does not exist, and then there are no points.
  Netresearch\NrMcpAgent\Service\Assistant\OpenPointReaderInterface:
    alias: Netresearch\NrMcpAgent\Service\Assistant\VisibleOpenPointReader

  Netresearch\NrMcpAgent\Service\Assistant\VisibleOpenPointReader:
    arguments:
      $visibility: '@?Netresearch\NrMcpAgent\Service\OpenPoint\OpenPointVisibility'

  Netresearch\NrMcpAgent\Service\Assistant\GuidedSkillProviderInterface:
    alias: Netresearch\NrMcpAgent\Service\Assistant\ConfiguredGuidedSkillProvider

  Netresearch\NrMcpAgent\Service\Assistant\QuickTaskProviderInterface:
    alias: Netresearch\NrMcpAgent\Service\Assistant\ConfiguredQuickTaskProvider

  # Pages to suggest for a guided tour; also for the chat's own page choice.
  Netresearch\NrMcpAgent\Service\Assistant\PageSuggestionProviderInterface:
    alias: Netresearch\NrMcpAgent\Service\Assistant\DeterministicPageSuggestionProvider

  # Which skills the widgets offer: those the chat's skill catalogue would
  # accept, under the identifier it accepts. "@?" injects null while the
  # catalogue service does not exist, and then no skill is offered.
  Netresearch\NrMcpAgent\Service\Assistant\SkillResolverInterface:
    alias: Netresearch\NrMcpAgent\Service\Assistant\CatalogueSkillResolver

  Netresearch\NrMcpAgent\Service\Assistant\CatalogueSkillResolver:
    arguments:
      $catalogue: '@?Netresearch\NrMcpAgent\Service\SkillCatalogueInterface'

  Netresearch\NrMcpAgent\Controller\ChatModuleController:
    public: true

  Netresearch\NrMcpAgent\Controller\ChatApiController:
    public: true

  # Processor: chosen by the extension setting processingStrategy (exec | worker)
  Netresearch\NrMcpAgent\Service\ChatProcessorInterface:
    factory: ['@Netresearch\NrMcpAgent\Service\ChatProcessorFactory', 'create']

  # Document extractors — tagged for DocumentExtractorRegistry
  Netresearch\NrMcpAgent\Document\DocumentExtractorRegistry:
    arguments:
      - !tagged_iterator document.extractor

  Netresearch\NrMcpAgent\Document\Extractor\PdfExtractor:
    tags: ['document.extractor']

  Netresearch\NrMcpAgent\Document\Extractor\DocxExtractor:
    tags: ['document.extractor']

  Netresearch\NrMcpAgent\Document\Extractor\XlsxExtractor:
    tags: ['document.extractor']

  Netresearch\NrMcpAgent\Document\Extractor\PlainTextExtractor:
    tags: ['document.extractor']
